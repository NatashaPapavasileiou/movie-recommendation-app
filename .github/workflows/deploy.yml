name: CI/CD Pipeline to AWS

# 1. When the pipeline is triggered
on:
  push:
    branches:
      - main # The pipeline runs automatically on every push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub's remote runner that will execute the commands

    steps:
      # Step 1: Check out the code from the GitHub repository onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Enable caching for faster dependency installation

      # Step 3: Install the application's dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Quality gate - a commit with lint errors or failing unit tests is never deployed
      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:unit

      # Step 5: Type-check and build the React application (produces the static dist folder)
      # Environment variables are securely injected here from GitHub Secrets
      - name: Build Application 
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Step 6: Authenticate with AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1 # Or whichever region you chose on AWS (e.g. us-east-1)

      # Step 7: Sync and upload the dist folder to the AWS S3 bucket
      # Hashed assets (JS/CSS) get a long, immutable cache lifetime since their filename
      # changes on every build; index.html is always revalidated so it's never served stale.
      - name: Deploy static site to AWS S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete --cache-control "public, max-age=31536000, immutable" --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"